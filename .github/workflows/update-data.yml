name: Update market data

on:
  schedule:
    - cron: "17 13 * * 1-5"     # 18:47 IST, Mon-Fri (after NSE close)
  workflow_dispatch:            # "Run workflow" button for a manual update

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet yfinance pandas numpy

      - name: Build data/market.json
        run: python scripts/update_data.py

      - name: Commit if changed
        run: |
          git config user.name  "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Update market data"
            git push
          fi
